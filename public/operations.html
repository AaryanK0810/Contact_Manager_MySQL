<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
    <link rel="stylesheet" href="operations.css">
</head>
<body>
    <main class="page-shell">
        <header class="page-header">
            <a href="index.html" class="home-icon" aria-label="Home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h4.5v-6h4v6h4.5V10"/></svg><span>Home</span></a>
            <div>
                <h1>Contact Manager</h1>
                <p class="page-subtitle">Keep your contacts organised in one place.</p>
            </div>
        </header>

        <section class="toolbar" aria-label="Contact actions">
            <div class="toolbar-intro">
                <h2>Contacts</h2>
                <p>View, search, add, and manage your contacts.</p>
            </div>
            <div class="toolbar-actions">
                <button id="getAllContacts" type="button" class="button button-secondary">Display all contacts</button>
                <button id="getContactById" type="button" class="button button-secondary">Search contacts</button>
                <button id="addAContact" type="button" class="button button-primary">+ Add contact</button>
            </div>
        </section>

        <section id="getContactForm" class="panel compact-panel" style="display: none;">
            <h3>Find a contact</h3>
            <div class="form-inline">
                <input type="text" id="contactQuery" placeholder="Enter contact ID or name" aria-label="Contact ID or name">
                <button id="submitContactId" type="button" class="button button-primary">Search</button>
            </div>
        </section>
        <div id="singleContactContainer" class="single-contact-container"></div>

        <section id="addContactForm" class="panel" style="display: none;">
            <div class="panel-heading">
                <div>
                    <h3>Add a contact</h3>
                    <p>Enter the details below.</p>
                </div>
            </div>
            <div class="form-grid">
                <label>Name<input type="text" id="contactName" placeholder="e.g. John Doe"></label>
                <label>Email<input type="email" id="contactEmail" placeholder="name@example.com"></label>
                <label>Phone<input type="text" id="contactPhone" placeholder="Phone number"></label>
                <label>Type<input type="text" id="contactType" placeholder="Personal or Work"></label>
            </div>
            <button id="submitContact" type="button" class="button button-primary">Save contact</button>
        </section>

        <section class="contacts-section">
            <div class="contacts-heading">
                <div>
                    <h2>All contacts</h2>
                    <p class="section-subtitle">Update or remove a contact using the actions on its right.</p>
                </div>
            </div>
            <div id="contactContainer" class="contact-list" style="display: none;"></div>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/getAllContacts.js"></script>
    <script src="js/getContactById.js"></script>
    <script src="js/addContact.js"></script>
    <script src="js/updateContact.js"></script>
    <script src="js/deleteContact.js"></script>
</body>
</html>
