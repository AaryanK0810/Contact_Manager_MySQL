<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Operations</title>
</head>
<body>

    <h1>Contact Operations</h1>

    <button id="getAllContacts">Get All Contacts</button>
    <div id = 'contactContainer'></div>

   <button id="getContactById">Get contact by ID</button>
    <div id="getContactForm" style="display: none;">
    <input type="number" id="contactId" placeholder="Enter contact ID">
    <button id="submitContactId">Get Contact</button>
    </div>
    <div id="singleContactContainer"></div>

    <input type="text" id="contactName" placeholder="Name">
    <input type="email" id="contactEmail" placeholder="Email">
    <input type="text" id="contactPhone" placeholder="Phone">
    <input type="text" id="contactType" placeholder="Type">

    <button id="submitContact">Add Contact</button>
    </div>

    <button id="updateContact">Update Contact</button>
    <button id="deleteContact">Delete Contact</button>

<script src="js/getAllContacts.js"></script>
<script src="js/getContactById.js"></script>
<script src="js/addContact.js"></script>
<script src="js/updateContact.js"></script>
<script src="js/deleteContact.js"></script>
</body>
</html>
