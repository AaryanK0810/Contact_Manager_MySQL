<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Manager</title>

    <link rel="stylesheet" href="operations.css">
</head>

<body>
     <a href="index.html" class="home-icon" aria-label="Home">
        ⌂
    </a>

    <h1>Contact Manager</h1>

    <!-- Get All Contacts -->
    <section>
        <h2>All Contacts</h2>

        <button id="getAllContacts">
            Display all contacts
        </button>

        <div id="contactContainer"></div>
    </section>


    <!-- Get Contact By ID -->
  <section>
    <h2>Find a Contact</h2>

    <button id="getContactById">Search contacts</button>

    <div id="getContactForm" style="display: none;">
        <input
            type="text"
            id="contactQuery"
            placeholder="Enter contact ID or name"
        >

        <button id="submitContactId">Search</button>
    </div>

    <div id="singleContactContainer"></div>
</section>


    <!-- Add Contact -->
    <section>
        <h2>Add a Contact</h2>

        <button id="addAContact">
            Add a contact
        </button>

        <div id="addContactForm" style="display: none;">

            <input
                type="text"
                id="contactName"
                placeholder="Name"
            >

            <input
                type="email"
                id="contactEmail"
                placeholder="Email"
            >

            <input
                type="text"
                id="contactPhone"
                placeholder="Phone"
            >

            <input
                type="text"
                id="contactType"
                placeholder="Type"
            >

            <button id="submitContact">
                Add Contact
            </button>

        </div>
    </section>


    <!-- Update Contact -->
    <section>
        <h2>Update a Contact</h2>

        <button id="updateAContact">
            Update a contact
        </button>

        <div id="updateContactForm" style="display: none;">

            <input
                type="number"
                id="updateContactId"
                placeholder="Contact ID"
            >

            <input
                type="text"
                id="updateContactName"
                placeholder="Name"
            >

            <input
                type="email"
                id="updateContactEmail"
                placeholder="Email"
            >

            <input
                type="text"
                id="updateContactPhone"
                placeholder="Phone"
            >

            <input
                type="text"
                id="updateContactType"
                placeholder="Type"
            >

            <button id="submitUpdateContact">
                Update Contact
            </button>

        </div>

        <div id="updateMessage"></div>
    </section>


    <!-- Delete Contact -->
    <section>
        <h2>Delete a Contact</h2>

        <button id="deleteButton">
            Delete a contact
        </button>

        <div id="deleteContactForm" style="display: none;">

            <input
                type="number"
                id="deleteContactId"
                placeholder="Contact ID"
            >

            <button id="submitDeleteContact">
                Delete Contact
            </button>

        </div>

        <div id="deleteMessage"></div>
    </section>


    <!-- JavaScript -->
    <script src="js/getAllContacts.js"></script>
    <script src="js/getContactById.js"></script>
    <script src="js/addContact.js"></script>
    <script src="js/updateContact.js"></script>
    <script src="js/deleteContact.js"></script>

</body>

</html>
