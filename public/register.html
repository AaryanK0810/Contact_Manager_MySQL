<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Contact Manager App</title>

    <link rel="stylesheet" href="register.css">
</head>

<body>
     <a href="index.html" class="home-icon" aria-label="Home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h4.5v-6h4v6h4.5V10"/></svg><span>Home</span></a>

    <main class="register-page">

        <div class="register-container">

            <h1>Create account.</h1>

            <p class="register-subtitle">
                Create a new Contact Manager account
            </p>

            <form id="registerForm">

                <div class="form-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>

                <button type="submit">Register</button>

            </form>

            <p id="message"></p>

        </div>

    </main>

    <script src="js/register.js"></script>

</body>

</html>
