<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>
      <a href="index.html" class="home-icon" aria-label="Home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h4.5v-6h4v6h4.5V10"/></svg><span>Home</span></a>

    <main class="login-page">

        <div class="login-container">

            <h1>Welcome back.</h1>

            <p class="login-subtitle">
                Login to your existing account
            </p>

            <form id="loginForm">

                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>

                <button type="submit">Login</button>

            </form>

            <p id="message"></p>

        </div>

    </main>

    <script src="js/login.js"></script>

</body>

</html>
